<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Primary Gradient (Indigo to Purple) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="1"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main container: Hexagon representing blockchain/fairness -->
  <g transform="translate(64, 64)">
    <!-- Outer hexagon -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="none"
             stroke="url(#brandGrad)"
             stroke-width="4"
             stroke-linejoin="round"
             filter="url(#glow)"/>

    <!-- Inner geometric shape: Game representation -->
    <rect x="-20" y="-20" width="40" height="40" rx="8"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="3"
          opacity="0.8"/>

    <!-- Center element: Fair by Code symbol -->
    <circle cx="0" cy="0" r="10" fill="url(#brandGrad)"/>
    <path d="M -5,0 L 0,-5 L 5,0 L 0,5 Z"
          fill="#FFFFFF"
          opacity="0.95"/>

    <!-- Corner accents -->
    <circle cx="25" cy="-25" r="3" fill="url(#accentGrad)" opacity="0.6"/>
    <circle cx="-25" cy="25" r="3" fill="url(#accentGrad)" opacity="0.6"/>
    <circle cx="25" cy="25" r="2.5" fill="url(#accentGrad)" opacity="0.5"/>
    <circle cx="-25" cy="-25" r="2.5" fill="url(#accentGrad)" opacity="0.5"/>
  </g>
</svg>
