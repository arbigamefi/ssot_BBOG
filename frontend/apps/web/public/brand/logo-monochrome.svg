<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome version: Single color (indigo-500) -->
  <g transform="translate(48, 48)">
    <!-- Outer hexagon -->
    <polygon points="0,-32 27.7,-16 27.7,16 0,32 -27.7,16 -27.7,-16"
             fill="none"
             stroke="#8F6CF9"
             stroke-width="3.5"
             stroke-linejoin="round"/>

    <!-- Inner shape -->
    <rect x="-16" y="-16" width="32" height="32" rx="6"
          fill="none"
          stroke="#8F6CF9"
          stroke-width="2.5"
          opacity="0.6"/>

    <!-- Center element -->
    <circle cx="0" cy="0" r="8" fill="#8F6CF9"/>
    <path d="M -4,0 L 0,-4 L 4,0 L 0,4 Z"
          fill="#FFFFFF"
          opacity="0.9"/>

    <!-- Corner accents -->
    <circle cx="20" cy="-20" r="2.5" fill="#8F6CF9" opacity="0.4"/>
    <circle cx="-20" cy="20" r="2.5" fill="#8F6CF9" opacity="0.4"/>
  </g>
</svg>
