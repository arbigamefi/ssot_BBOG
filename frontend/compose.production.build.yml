services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_BUILD_NODE_OPTIONS: ${WEB_BUILD_NODE_OPTIONS:---max-old-space-size=2048}
        WEB_LOW_MEMORY_BUILD: ${WEB_LOW_MEMORY_BUILD:-1}
        NEXT_SKIP_BUILD_VALIDATION: ${NEXT_SKIP_BUILD_VALIDATION:-1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://arbigamefi.com}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-8453}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID:-6d44f31abf9391610c3a42e8e7a2d763}
        NEXT_PUBLIC_ALCHEMY_API_KEY: ${NEXT_PUBLIC_ALCHEMY_API_KEY:-}
        NEXT_PUBLIC_BASE_RPC_URL: ${NEXT_PUBLIC_BASE_RPC_URL:-https://mainnet.base.org}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        NEXT_PUBLIC_ARBITRUM_RPC_URL: ${NEXT_PUBLIC_ARBITRUM_RPC_URL:-}
        NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL:-}
        NEXT_PUBLIC_MAINNET_RPC_URL: ${NEXT_PUBLIC_MAINNET_RPC_URL:-https://cloudflare-eth.com}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
        NEXT_PUBLIC_ENABLE_ENS_LOOKUP: ${NEXT_PUBLIC_ENABLE_ENS_LOOKUP:-true}
        NEXT_PUBLIC_CASINO_RISK_IN_ENABLED: ${NEXT_PUBLIC_CASINO_RISK_IN_ENABLED:-false}
        NEXT_PUBLIC_SPORTSBOOK_ENABLED: ${NEXT_PUBLIC_SPORTSBOOK_ENABLED:-false}

  keeper-primary:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.keeper

  keeper-testnet-primary:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.keeper

  keeper-backup:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.keeper
