name: arbigamefi-v15

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/postgres.env
    volumes:
      - bet_index_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable digest}
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/web.production.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      KEEPER_HEALTH_PATH: /var/lib/arbigamefi/casino-keeper/base-mainnet-primary-health.json
      KEEPER_HEALTH_PATH_8453: /var/lib/arbigamefi/casino-keeper/base-mainnet-primary-health.json
      KEEPER_HEALTH_PATH_84532: /var/lib/arbigamefi/casino-keeper/base-sepolia-primary-health.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keeper_health:/var/lib/arbigamefi/casino-keeper:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - internal

  keeper-primary:
    image: ${KEEPER_IMAGE:?Set KEEPER_IMAGE to an immutable digest}
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/keeper.primary.env
    environment:
      KEEPER_HEALTH_PATH: /var/lib/arbigamefi/casino-keeper/base-mainnet-primary-health.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keeper_health:/var/lib/arbigamefi/casino-keeper
    networks:
      - internal

  keeper-testnet-primary:
    image: ${KEEPER_IMAGE:?Set KEEPER_IMAGE to an immutable digest}
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/keeper.testnet.primary.env
    environment:
      KEEPER_HEALTH_PATH: /var/lib/arbigamefi/casino-keeper/base-sepolia-primary-health.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keeper_health:/var/lib/arbigamefi/casino-keeper
    networks:
      - internal

  # Prefer running the backup keeper on a different host/region. This local
  # profile exists for staging drills only.
  keeper-backup:
    profiles: ["backup-local"]
    image: ${KEEPER_IMAGE:?Set KEEPER_IMAGE to an immutable digest}
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/keeper.backup.env
    environment:
      KEEPER_HEALTH_PATH: /var/lib/arbigamefi/casino-keeper/base-mainnet-backup-health.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keeper_health:/var/lib/arbigamefi/casino-keeper
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/docker/env/proxy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
      - public

volumes:
  bet_index_postgres_data:
  keeper_health:
  caddy_data:
  caddy_config:

networks:
  internal:
  public:
