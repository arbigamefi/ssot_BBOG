[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.37"
optimizer = true
# Keep at least 1 KB of runtime bytecode margin under EIP-170.
# Enforced by test/unit/ContractSizes.t.sol.
optimizer_runs = 500
via_ir = true
evm_version = "cancun"

# Filesystem permissions for scripts.
#
# Foundry restricts filesystem access by default. Our deploy/release scripts
# write snapshots, verify helpers, and bundles under `deployments/` and `dist/`.
#
# NOTE: Per Foundry config docs, options should live under a profile (e.g. `default`).
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./dist" }
]

# Complete and explicit: build metadata, and with it every runtime codehash (the certified module codehashes in
# script/release/first-callback-domain-*.json), must not depend on how lib/ is materialized (checkout, symlink
# or CI install). Auto-detection would record environment-specific paths.
auto_detect_remappings = false
remappings = [
  "@chainlink/=lib/chainlink-brownie-contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "chainlink-brownie-contracts/=lib/chainlink-brownie-contracts/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/"
]

# Fast-but-meaningful PR gate profile.
# Keeps runtime reasonable while still catching drift.
[profile.pr]

[profile.pr.fuzz]
runs = 256

[profile.pr.invariant]
runs = 256
depth = 256

# Nightly profile: higher coverage for regression discovery.
[profile.nightly]

[profile.nightly.fuzz]
runs = 1024

[profile.nightly.invariant]
runs = 1024
depth = 512

# Release profile: high-coverage gate for mainnet-bound tags.
# Usage: FOUNDRY_PROFILE=release forge test
[profile.release]

[profile.release.fuzz]
runs = 4096

[profile.release.invariant]
runs = 4096
depth = 1024

# Optional multi-chain configuration helpers.
# These are used by scripts and verification commands.
#
# Set the env vars in your shell, e.g.
#   export BASE_RPC_URL=...
#   export ARBITRUM_RPC_URL=...
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

# Unified Etherscan V2 verification.
[etherscan]
base = { key = "${ETHERSCAN_V2_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api?chainid=8453" }
base_sepolia = { key = "${ETHERSCAN_V2_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
arbitrum = { key = "${ETHERSCAN_V2_API_KEY}", chain = 42161, url = "https://api.etherscan.io/v2/api?chainid=42161" }
arbitrum_sepolia = { key = "${ETHERSCAN_V2_API_KEY}", chain = 421614, url = "https://api.etherscan.io/v2/api?chainid=421614" }



# -----------------------------------------------------------------------------
# Linting
# -----------------------------------------------------------------------------
# Foundry runs `forge lint` automatically during `forge build` unless disabled.
# We keep linting available, but do NOT run it on every build because it can be
# noisy and it is not part of the protocol correctness proof gates.
#
# Run manually when desired:
#   make lint

# Linter configuration. By default we do NOT lint on build to keep deploy/verify logs clean.
[lint]
lint_on_build = false
severity = ["high", "med"]
ignore = ["test/**", "script/**"]

# Preserve the pinned upstream baseline and its documented RANGE_SUM and UNUSED_SUFFIX patches;
# MANIFEST.sha256 pins the applied files and both patch files, which record the deltas.
[fmt]
ignore = ["src/vendor/azuro-v3/**"]
