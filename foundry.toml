[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 20000
via_ir = true
evm_version = "cancun"

# Filesystem permissions for scripts.
#
# Foundry restricts filesystem access by default. Our deploy/release scripts
# write snapshots, verify helpers, and bundles under `deployments/` and `dist/`.
#
# NOTE: Per Foundry config docs, options should live under a profile (e.g. `default`).
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./dist" }
]

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@chainlink/=lib/chainlink-brownie-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Fast-but-meaningful PR gate profile.
# Keeps runtime reasonable while still catching drift.
[profile.pr]

[profile.pr.fuzz]
runs = 256

[profile.pr.invariant]
runs = 256
depth = 256

# Nightly profile: higher coverage for regression discovery.
[profile.nightly]

[profile.nightly.fuzz]
runs = 1024

[profile.nightly.invariant]
runs = 1024
depth = 512

# Release profile: high-coverage gate for mainnet-bound tags.
# Usage: FOUNDRY_PROFILE=release forge test
[profile.release]

[profile.release.fuzz]
runs = 4096

[profile.release.invariant]
runs = 4096
depth = 1024

# Optional multi-chain configuration helpers.
# These are used by scripts and verification commands.
#
# Set the env vars in your shell, e.g.
#   export BASE_RPC_URL=...
#   export ARBITRUM_RPC_URL=...
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

# Explorer API endpoints (Etherscan-family).
# We default to a single unified key (`ETHERSCAN_API_KEY`).
# If you prefer per-chain keys, override by exporting those env vars
# and editing this section.
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161, url = "https://api.arbiscan.io/api" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614, url = "https://api-sepolia.arbiscan.io/api" }



# -----------------------------------------------------------------------------
# Linting
# -----------------------------------------------------------------------------
# Foundry runs `forge lint` automatically during `forge build` unless disabled.
# We keep linting available, but do NOT run it on every build because it can be
# noisy and it is not part of the protocol correctness proof gates.
#
# Run manually when desired:
#   make lint

# Linter configuration. By default we do NOT lint on build to keep deploy/verify logs clean.
[lint]
lint_on_build = false
severity = ["high", "med"]
ignore = ["test/**", "script/**"]
