# Dependency lock (human-readable)
#
# Purpose: minimize supply-chain drift across environments and CI.
#
# Toolchain. Every workflow installs exactly FOUNDRY_VERSION; install_deps.sh refuses another Foundry pin in
# .github/workflows or another installed forge, cast or anvil (check_toolchain.py). It also installs SOLC_VERSION from
# binaries.soliditylang.org and refuses the binary unless its SHA-256 matches, because foundry.toml compiles offline.
# Local nodes run anvil with ANVIL_ARGS: Base's hardfork at the target time, with the EIP-7825 transaction gas cap
# that anvil leaves off unless asked.
FOUNDRY_VERSION=v1.8.5
FOUNDRY_COMMIT=51a52c59cffd940f76eddd0b4bb1791aa4b5ac7f
SOLC_VERSION=0.8.37
SOLC_LINUX_AMD64_BUILD=solc-linux-amd64-v0.8.37+commit.f401782d
SOLC_LINUX_AMD64_SHA256=5de843c2c93563cc66425c99a4fb13fdbf32b4c4ae07469480faaf126e14404a
SOLC_MACOSX_AMD64_BUILD=solc-macosx-amd64-v0.8.37+commit.f401782d
SOLC_MACOSX_AMD64_SHA256=a27396e7732aa52e80ff89ad7bd8a2e46fec2a6dcc4ef20cd16e5e0c502d6821
EVM_VERSION=cancun
VIA_IR=true
ANVIL_ARGS=--network base --hardfork azul --enable-tx-gas-limit

# Solidity libraries. install_deps.sh installs each one at *_COMMIT (the commit the tag *_NAME pointed to when it
# was pinned; the tag is kept for humans only, a tag can be moved) and then refuses the install unless the compiled
# subtree *_SUBTREE (the directory the remappings point at) has the content digest *_SHA256. A moved tag or a
# tampered mirror therefore cannot change the audited bytecode silently (audit finding F-06). Files outside that
# subtree (nested lib/, docs, CI files) are never compiled and are not part of the digest.
#
# Digest of a subtree, exactly as install_deps.sh computes it:
#   (cd lib/<repo>/<SUBTREE> && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256)
FORGE_STD=v1.14.0
FORGE_STD_COMMIT=1801b0541f4fda118a10798fd3486bb7051c5dd6
FORGE_STD_SUBTREE=src
FORGE_STD_SHA256=4577a3e14478b02186b6f061acaf1220cbdbc3701fceb7d18851cd887983717e
OPENZEPPELIN_CONTRACTS=v5.5.0
OPENZEPPELIN_CONTRACTS_COMMIT=fcbae5394ae8ad52d8e580a3477db99814b9d565
OPENZEPPELIN_CONTRACTS_SUBTREE=contracts
OPENZEPPELIN_CONTRACTS_SHA256=38c3e2aa1a2237968a33366fcb35af0cec23f26ecf4712a7922e3ac58f4e9a3a
CHAINLINK_BROWNIE_CONTRACTS=1.3.0
CHAINLINK_BROWNIE_CONTRACTS_COMMIT=5cb41fbc9b525338b6098da5ea7dd0b7e92f89e4
CHAINLINK_BROWNIE_CONTRACTS_SUBTREE=contracts
CHAINLINK_BROWNIE_CONTRACTS_SHA256=53b627e41e80ed9d031b38bed360870ec20da3d44e59f4280c4a1ce51924e20a
