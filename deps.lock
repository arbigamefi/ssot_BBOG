# Dependency lock (human-readable)
#
# Purpose: minimize supply-chain drift across environments and CI.
#
# Tooling
FOUNDRY_CHANNEL=stable
SOLC_VERSION=0.8.37
EVM_VERSION=cancun
VIA_IR=true

# Solidity libraries: tag, the commit the tag pointed to when pinned, and the content digest of the installed
# tree (find -type f | sort | shasum -a 256 | shasum -a 256). install_deps.sh refuses a tree whose digest differs,
# so a moved tag or a tampered mirror cannot change the audited bytecode silently (audit finding F-06).
FORGE_STD=v1.14.0
FORGE_STD_COMMIT=1801b0541f4fda118a10798fd3486bb7051c5dd6
FORGE_STD_SHA256=e29f6a5e29ace013da63e72e7225b7a37f4519ad6092223d69469140260de08b
