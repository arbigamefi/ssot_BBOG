name: Governance Replay

# The release gate replays governance logs on the Base public RPCs (launch candidate A1). This job replays a recorded
# deployment over a fixed, finalized range three times in a row, in full and from a committed checkpoint, so paging and
# retries are proven on GitHub runners before a release depends on them.

on:
  push:
    branches: [master]
    paths:
      - "script/release/verify_governance.py"
      - "script/ci/governance_replay_live.py"
      - "test/fixtures/governance/**"
      - ".github/workflows/governance-replay.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # verify_governance.py hashes event signatures with `cast keccak`.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5 # FOUNDRY_VERSION in deps.lock; check_toolchain.py refuses any other pin

      - name: Replay three times on the Base Sepolia public RPC
        run: |
          for run in 1 2 3; do
            echo "run $run"
            python3 script/ci/governance_replay_live.py test/fixtures/governance/base-sepolia-47938596.json https://sepolia.base.org
          done
