name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src/**"
      - "test/mocks/**"
      - "test/unit/Bank*"
      - "script/ci/bank_sdk_integration.sh"
      - "script/ci/bank_wallet_e2e.sh"
      - "script/ci/keeper_integration.sh"
      - "script/ci/install_deps.sh"
      - "foundry.toml"
      - "remappings.txt"
      - "deps.lock"
      - ".github/workflows/frontend-ci.yml"
      - ".node-version"
      - "package.json"
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "src/**"
      - "test/mocks/**"
      - "test/unit/Bank*"
      - "script/ci/bank_sdk_integration.sh"
      - "script/ci/bank_wallet_e2e.sh"
      - "script/ci/keeper_integration.sh"
      - "script/ci/install_deps.sh"
      - "foundry.toml"
      - "remappings.txt"
      - "deps.lock"
      - ".github/workflows/frontend-ci.yml"
      - ".node-version"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      recovery-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keeper_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: keeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keeper_test -d keeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::notice::pnpm-lock.yaml is missing. Run 'pnpm install' locally and commit the lockfile to enable deterministic CI."
            pnpm install
          fi

      - name: Release snapshot sanity
        run: pnpm check:release

      - name: Frontend architecture precheck
        run: pnpm precheck:frontend -- --strict

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          KEEPER_TEST_POSTGRES_URL: postgres://keeper_test:local_ci_only@127.0.0.1:5432/keeper_test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm check:bundle

      - name: Install Playwright browsers
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: E2E and accessibility smoke
        run: PLAYWRIGHT_USE_EXISTING_BUILD=1 pnpm e2e

      - name: Build Storybook
        run: pnpm storybook:build

  bank-sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: bash script/ci/install_deps.sh
      - run: pnpm -C frontend install --frozen-lockfile
      - name: Real Bank and SDK on isolated Anvil (required, no skip)
        run: bash script/ci/bank_sdk_integration.sh
      - name: Real keeper restart and refunds on Anvil with PostgreSQL
        run: bash script/ci/keeper_integration.sh
      - name: Install browser for connected-wallet gate
        run: pnpm -C frontend/apps/web exec playwright install --with-deps chromium
      - name: Connected wallet and actual Bank cash (required)
        run: bash script/ci/bank_wallet_e2e.sh
