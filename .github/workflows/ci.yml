name: CI

on:
  pull_request:
  push:
    # Run CI on all branches so feature pushes get feedback immediately.
    branches: ["**"]
    # Also run on version tags to ensure the tag itself is green.
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: forge --version

      - name: Validate keeper key and v1.6 release safety
        run: |
          bash -n script/ops/swap-keeper-key.sh
          python3 -m unittest discover -s test/ops -v

      - name: Verify historical-recovery accounting model
        run: python3 test/model/recovery_pocket_model.py

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Run unit tests (PR profile)
        run: |
          FOUNDRY_PROFILE=pr forge test --no-match-path "test/unit/DeploymentV16.t.sol" --match-path "test/unit/*" -vvv

      - name: Verify v1.6 deployment and governance boundary
        run: FOUNDRY_PROFILE=pr forge test --threads 1 --match-path "test/unit/DeploymentV16.t.sol" -vvv

      - name: Verify casino admission with isolated transaction gas accounting
        run: make test-casino-admission

      - name: Run diff tests (PR profile)
        run: |
          FOUNDRY_PROFILE=pr forge test --match-path "test/diff/*" -vvv

      - name: Run invariants (PR profile)
        run: |
          FOUNDRY_PROFILE=pr forge test --match-path "test/invariants/*" -vvv

      - name: Run fork tests (optional)
        run: |
          FOUNDRY_PROFILE=pr forge test --match-path "test/fork/*" -vvv

      - name: Check Bank ABI drift
        run: |
          PYTHON=python3 make bank-abi-drift-check

      - name: Release artifacts check (non-strict)
        run: |
          make release-check
