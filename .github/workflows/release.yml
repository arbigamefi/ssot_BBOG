name: Release Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: forge --version

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Proof gates (nightly profile)
        run: |
          FOUNDRY_PROFILE=nightly forge test --match-path "test/unit/*" -vvv
          FOUNDRY_PROFILE=nightly forge test --match-path "test/diff/*" -vvv
          FOUNDRY_PROFILE=nightly forge test --match-path "test/invariants/*" -vvv

      - name: Release lock must be present and valid
        run: |
          STRICT=1 make release-check

      - name: Fork tests (release gate)
        env:
          # Provide per-network fork RPCs via repository secrets.
          # Only the RPC for the deployed chainId (from deployments/latest-v13.json) is required.
          FORK_RPC_URL_BASE: ${{ secrets.FORK_RPC_URL_BASE }}
          FORK_RPC_URL_BASE_SEPOLIA: ${{ secrets.FORK_RPC_URL_BASE_SEPOLIA }}
          FORK_RPC_URL_ARBITRUM_ONE: ${{ secrets.FORK_RPC_URL_ARBITRUM_ONE }}
          FORK_RPC_URL_ARBITRUM_SEPOLIA: ${{ secrets.FORK_RPC_URL_ARBITRUM_SEPOLIA }}
        run: |
          bash script/ci/fork_release_gate.sh

      - name: Build audit handoff bundle
        run: |
          TAG_NAME=${{ github.ref_name }} make audit-package
