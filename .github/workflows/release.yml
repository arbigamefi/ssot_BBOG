name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing the deployment bundle
        required: true
        type: string
      bundle_name:
        description: Exact tar.gz release asset name
        required: true
        type: string
      bundle_sha256:
        description: Approved SHA-256 of that exact archive
        required: true
        type: string
      audited_source_tree:
        description: git tree hash of the externally audited source (from the audit report); the gate refuses any release_tag whose tree differs
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The tree equivalence and differential suites at 4,096 fuzz runs (ADR-0034 amendment 2026-10-07). They take
  # about 36 minutes on a 16-core workstation; the runner time is not measured yet, hence a separate job.
  tree-equivalence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Release tag must be the audited source tree
        env:
          AUDITED_TREE: ${{ inputs.audited_source_tree }}
          REFERENCE_TREE: ${{ vars.V16_AUDITED_TREE }}
        run: |
          # The input is typed by the dispatcher; the repository variable is set by the Owner from the audit report.
          # Both must name the tree that is checked out (fix review R-1).
          if [ -z "$REFERENCE_TREE" ]; then
            echo "repository variable V16_AUDITED_TREE is not set; the Owner records the audited tree there"; exit 1
          fi
          if [ "$AUDITED_TREE" != "$REFERENCE_TREE" ]; then
            echo "input audited_source_tree $AUDITED_TREE differs from repository variable V16_AUDITED_TREE $REFERENCE_TREE"; exit 1
          fi
          actual=$(git rev-parse 'HEAD^{tree}')
          if [ "$actual" != "$AUDITED_TREE" ]; then
            echo "release_tag tree $actual differs from the audited tree $AUDITED_TREE"; exit 1
          fi
          echo "release_tag ${{ inputs.release_tag }} is the audited source tree $actual"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # Foundry pinned to the release candidate toolchain (freeze 2026-10-08); do not use a floating "stable"

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Tree equivalence gates (release profile, 4,096 fuzz runs)
        run: |
          make tree-equivalence-release

  # The nightly-profile proof suites, one job each (see nightly.yml for the measured runner times). They read only
  # the checked-out source, not the release bundle.
  proof-gates:
    name: proof-gates (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            command: FOUNDRY_PROFILE=nightly forge test --threads 1 --match-path "test/unit/*" -vvv
          - suite: diff
            command: FOUNDRY_PROFILE=nightly forge test --match-path "test/diff/*" -vvv
          - suite: invariants
            command: FOUNDRY_PROFILE=nightly forge test --match-path "test/invariants/*" -vvv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Release tag must be the audited source tree
        env:
          AUDITED_TREE: ${{ inputs.audited_source_tree }}
          REFERENCE_TREE: ${{ vars.V16_AUDITED_TREE }}
        run: |
          # The input is typed by the dispatcher; the repository variable is set by the Owner from the audit report.
          # Both must name the tree that is checked out (fix review R-1).
          if [ -z "$REFERENCE_TREE" ]; then
            echo "repository variable V16_AUDITED_TREE is not set; the Owner records the audited tree there"; exit 1
          fi
          if [ "$AUDITED_TREE" != "$REFERENCE_TREE" ]; then
            echo "input audited_source_tree $AUDITED_TREE differs from repository variable V16_AUDITED_TREE $REFERENCE_TREE"; exit 1
          fi
          actual=$(git rev-parse 'HEAD^{tree}')
          if [ "$actual" != "$AUDITED_TREE" ]; then
            echo "release_tag tree $actual differs from the audited tree $AUDITED_TREE"; exit 1
          fi
          echo "release_tag ${{ inputs.release_tag }} is the audited source tree $actual"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # Foundry pinned to the release candidate toolchain (freeze 2026-10-08); do not use a floating "stable"

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Proof gate ${{ matrix.suite }} (nightly profile)
        run: ${{ matrix.command }}

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SIGNER: ${{ vars.V16_RELEASE_SIGNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Release tag must be the audited source tree
        env:
          AUDITED_TREE: ${{ inputs.audited_source_tree }}
          REFERENCE_TREE: ${{ vars.V16_AUDITED_TREE }}
        run: |
          # The input is typed by the dispatcher; the repository variable is set by the Owner from the audit report.
          # Both must name the tree that is checked out (fix review R-1).
          if [ -z "$REFERENCE_TREE" ]; then
            echo "repository variable V16_AUDITED_TREE is not set; the Owner records the audited tree there"; exit 1
          fi
          if [ "$AUDITED_TREE" != "$REFERENCE_TREE" ]; then
            echo "input audited_source_tree $AUDITED_TREE differs from repository variable V16_AUDITED_TREE $REFERENCE_TREE"; exit 1
          fi
          actual=$(git rev-parse 'HEAD^{tree}')
          if [ "$actual" != "$AUDITED_TREE" ]; then
            echo "release_tag tree $actual differs from the audited tree $AUDITED_TREE"; exit 1
          fi
          echo "release_tag ${{ inputs.release_tag }} is the audited source tree $actual"

      - name: Download explicit release input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_NAME: ${{ inputs.bundle_name }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          # Use the exact asset name, never a glob which could select several bundles.
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.tar\.gz", os.environ["BUNDLE_NAME"]):
              raise SystemExit("invalid bundle name")
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BUNDLE_NAME" --dir "$RUNNER_TEMP/release-download"
          python3 script/release/import_release_bundle.py \
            --bundle "$RUNNER_TEMP/release-download/$BUNDLE_NAME" \
            --sha256 "$BUNDLE_SHA256" --destination "$GITHUB_WORKSPACE/deployments/.release-input"
          {
            echo "RELEASE_PATH=$GITHUB_WORKSPACE/deployments/.release-input/deployments/release-latest-v16.json"
            echo "SNAPSHOT_PATH=$GITHUB_WORKSPACE/deployments/.release-input/deployments/latest-v16.json"
            echo "NOTES_PATH=$GITHUB_WORKSPACE/deployments/.release-input/deployments/release-notes-latest-v16.md"
            echo "FRONTEND_MANIFEST_PATH=$GITHUB_WORKSPACE/deployments/.release-input/deployments/frontend-manifest-latest-v16.json"
            echo "GOLDEN_VECTORS_PATH=$GITHUB_WORKSPACE/deployments/.release-input/deployments/golden-vectors-latest-v16.json"
            echo "ABI_INDEX_PATH=$GITHUB_WORKSPACE/deployments/.release-input/abis/index.json"
          } >> "$GITHUB_ENV"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # Foundry pinned to the release candidate toolchain (freeze 2026-10-08); do not use a floating "stable"

      - name: Show Forge version
        run: forge --version

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Release lock must be present and valid
        run: |
          STRICT=1 make release-check

      - name: Fork tests (release gate)
        env:
          # Provide per-network fork RPCs via repository secrets.
          # Only the RPC for the deployed chainId (from deployments/latest-v16.json) is required.
          FORK_RPC_URL_BASE: ${{ secrets.FORK_RPC_URL_BASE }}
          FORK_RPC_URL_BASE_SEPOLIA: ${{ secrets.FORK_RPC_URL_BASE_SEPOLIA }}
          FORK_RPC_URL_ARBITRUM_ONE: ${{ secrets.FORK_RPC_URL_ARBITRUM_ONE }}
          FORK_RPC_URL_ARBITRUM_SEPOLIA: ${{ secrets.FORK_RPC_URL_ARBITRUM_SEPOLIA }}
        run: |
          bash script/ci/fork_release_gate.sh

      - name: Build audit handoff bundle
        run: |
          make audit-package

      - name: Upload source audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: dist/ssot-audit-*.tar.gz
          if-no-files-found: error

  # The release is ready only when every gate passes: judge the release on this job, not on any gate alone.
  release-ready:
    runs-on: ubuntu-latest
    needs: [tree-equivalence-gate, proof-gates, release-gate]
    steps:
      - name: All release gates passed
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          AUDITED_TREE: ${{ inputs.audited_source_tree }}
          BUNDLE_NAME: ${{ inputs.bundle_name }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          echo "tree-equivalence-gate, proof-gates (unit, diff, invariants) and release-gate passed for $RELEASE_TAG"
          echo "audited source tree: $AUDITED_TREE (equal to repository variable V16_AUDITED_TREE)"
          echo "bundle: $BUNDLE_NAME sha256 $BUNDLE_SHA256"
