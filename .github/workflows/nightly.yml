name: Nightly Proof Gates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    # The chained Vault differential adds roughly 25 serial minutes at 1,024 runs (measured locally, not on a runner).
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # Foundry pinned to the release candidate toolchain (freeze 2026-10-08); do not use a floating "stable"

      - name: Show Forge version
        run: forge --version

      - name: Install pinned dependencies
        run: |
          bash script/ci/install_deps.sh

      - name: Run unit tests (nightly profile)
        run: |
          FOUNDRY_PROFILE=nightly forge test --threads 1 --match-path "test/unit/*" -vvv

      - name: Run diff tests (nightly profile)
        run: |
          FOUNDRY_PROFILE=nightly forge test --match-path "test/diff/*" -vvv

      - name: Run invariants (nightly profile)
        run: |
          FOUNDRY_PROFILE=nightly forge test --match-path "test/invariants/*" -vvv

      - name: Run fork tests (optional)
        run: |
          FOUNDRY_PROFILE=nightly forge test --match-path "test/fork/*" -vvv

      - name: Release artifacts check (non-strict)
        run: |
          make release-check
